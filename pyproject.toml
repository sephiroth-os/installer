[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "sephirothinstaller"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "PySide6>=6.7,<7",
    "packaging>=24,<27",
    "requests>=2.34,<2.37",
    "winshell>=0.6,<0.7",
    "pywin32>=310,<315",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10"
]

[project.scripts]
sephirothinstaller = "sephirothinstaller.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]